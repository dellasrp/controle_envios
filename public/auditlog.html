<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Envios · Auditoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { ink: '#093E34', slab: '#305D54', accent: '#16836D', accentBright: '#1BA085', lime: '#8DC540' }, fontFamily: { sans: ['Host Grotesk', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'] } } }
    };
  </script>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800">
  <header class="border-b border-slate-200 bg-ink text-slate-100">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
      <div class="flex items-center gap-3">
        <img src="/img/logo-white.png" alt="smar(apd)" class="h-6 w-auto" />
        <span class="font-semibold tracking-tight">Controle de Envios</span>
      </div>
      <nav class="flex items-center gap-1 text-sm">
        <a href="/app.html" class="rounded px-3 py-1.5 text-slate-300 hover:bg-white/10">Tabela</a>
        <a href="/dashboard.html" class="rounded px-3 py-1.5 text-slate-300 hover:bg-white/10">Dashboard</a>
        <a href="/prazos.html" class="rounded px-3 py-1.5 text-slate-300 hover:bg-white/10">Parametrização</a>
        <a href="/usuarios.html" class="rounded px-3 py-1.5 text-slate-300 hover:bg-white/10">Usuários</a>
        <a href="/auditlog.html" class="rounded px-3 py-1.5 font-medium text-white bg-white/10">Auditoria</a>
        <div class="mx-2 h-5 w-px bg-white/20"></div>
        <div id="userNome" class="text-sm font-medium"></div>
        <button onclick="logout()" class="ml-2 rounded px-3 py-1.5 text-slate-300 hover:bg-white/10">Sair</button>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-6">
    <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
      <div>
        <h1 class="text-xl font-semibold tracking-tight">Log de auditoria</h1>
        <p id="resumo" class="text-sm text-slate-500"></p>
      </div>
      <button onclick="exportarLog()" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Exportar log (.json)</button>
    </div>

    <div class="mb-4 grid grid-cols-2 gap-3 sm:grid-cols-5">
      <input id="fUsuario" type="text" placeholder="Usuário..." oninput="buscar()" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-accent" />
      <select id="fAcao" onchange="buscar()" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-accent">
        <option value="">Todas as ações</option>
        <option value="criar">Criar cliente</option>
        <option value="editar">Editar cliente</option>
        <option value="excluir">Excluir cliente</option>
        <option value="criar_usuario">Criar usuário</option>
        <option value="editar_usuario">Editar usuário</option>
        <option value="excluir_usuario">Excluir usuário</option>
        <option value="editar_prazos">Editar prazos</option>
        <option value="exportar_backup">Exportar backup</option>
        <option value="importar_backup">Importar backup</option>
        <option value="trocar_senha">Troca de senha</option>
      </select>
      <select id="fFuncionalidade" onchange="buscar()" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-accent">
        <option value="">Todas as funcionalidades</option>
        <option value="Clientes">Clientes</option>
        <option value="Usuarios">Usuários</option>
        <option value="Parametrização">Parametrização</option>
        <option value="Backup">Backup</option>
        <option value="Senha">Senha</option>
      </select>
      <input id="fDataInicio" type="date" onchange="buscar()" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-accent" />
      <input id="fDataFim" type="date" onchange="buscar()" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-accent" />
    </div>

    <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-slate-200 bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-500">
            <th class="px-4 py-3 whitespace-nowrap">Data / Hora</th>
            <th class="px-4 py-3">Usuário</th>
            <th class="px-4 py-3">Perfil</th>
            <th class="px-4 py-3">IP</th>
            <th class="px-4 py-3">Máquina</th>
            <th class="px-4 py-3">Funcionalidade</th>
            <th class="px-4 py-3">Ação</th>
            <th class="px-4 py-3">Detalhes</th>
          </tr>
        </thead>
        <tbody id="tabelaBody"></tbody>
      </table>
    </div>

    <div id="paginacao" class="mt-4 flex items-center justify-between text-sm text-slate-500"></div>

    <div id="modalDetalhe" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/50 p-4">
      <div class="max-h-[80vh] w-full max-w-3xl overflow-y-auto rounded-xl bg-white shadow-2xl">
        <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4">
          <h2 class="text-lg font-semibold">Detalhe do evento</h2>
          <button onclick="fecharDetalhe()" class="text-slate-400 hover:text-slate-700">✕</button>
        </div>
        <div class="space-y-4 px-6 py-5">
          <div id="detalheInfo" class="grid grid-cols-2 gap-3 text-sm"></div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <p class="mb-1 text-xs font-semibold uppercase tracking-wide text-slate-400">Dado anterior</p>
              <pre id="detalheAnterior" class="max-h-60 overflow-y-auto rounded-lg bg-slate-50 p-3 text-xs text-slate-700 whitespace-pre-wrap break-all"></pre>
            </div>
            <div>
              <p class="mb-1 text-xs font-semibold uppercase tracking-wide text-slate-400">Dado atual</p>
              <pre id="detalheAtual" class="max-h-60 overflow-y-auto rounded-lg bg-slate-50 p-3 text-xs text-slate-700 whitespace-pre-wrap break-all"></pre>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auditlog.js"></script>
</body>
</html>
